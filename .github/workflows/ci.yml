name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Repository checks
        run: python tools/check_repository.py
      - name: Build production and test apps
        shell: powershell
        run: |
          ./build.ps1 -OutputDirectory build/production
          ./build.ps1 -Test
      - name: Core regression checks
        run: |
          python tests/windows/verify_apng.py
          python tests/windows/verify_tools.py
          python tests/windows/verify_inspection.py
          python tests/windows/verify_obfuscation.py
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install SDK build packages
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Prepare pinned runtime and shipped native libraries
        run: python tools/prepare_android_ci.py
      - name: Build and verify APKs with an ephemeral CI key
        env:
          AIPT_ONNXRT_DIR: ${{ github.workspace }}/build/android-ci/ort
          AIPT_NATIVE_LIB_DIR: ${{ github.workspace }}/build/android-ci/native
        run: |
          export AIPT_SDK_ROOT="$ANDROID_HOME" AIPT_JAVA_HOME="$JAVA_HOME"
          python android/build.py --test
          python android/build.py
