name: Publish standalone image scramble
on:
  push:
    branches: [main]
    paths: ['obfuscation/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check standalone delivery
        run: |
          test -f obfuscation/index.html
          test "$(find obfuscation -type f | wc -l)" -eq 1
          test -z "$(find obfuscation -type l)"
          ! grep -q 'id="selfCheck"' obfuscation/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: obfuscation
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
